name: Build Vamp

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vamp
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Vamp
        run: gradle build

      - name: Upload Vamp JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vamp-1.21.11
          path: build/libs/*.jar
